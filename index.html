<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레시피</title>
  <!-- P2: 여기에 style.css 를 연결합니다 -->
</head>
<body>
  <h1>봉골레 파스타</h1>
  <p> 바지락의 <strong> 짭조름한 바다 향</strong>을 살린 <em>이탈리아식</em> 파스타.</p
  >
  <img src="images/vongole.jpg" alt="바지락과 파슬리를 올린 스파게티 한 접시" width="480">
  <h2>정보</h2>
  <table>
    <tr><th>분량</th><th>시간</th><th>난이도</th></tr>
    <tr><td>2인분</td><td>25분</td><td>보통</td></tr>
  </table>
  <h2>재료</h2>
  <ul>
     <li>스파게티 100g</li>
     <li>해감한 바지락 200g</li>
     <li>양파 50g</li>
     <li>배추 30g</li>
  
  </ul>
  <h2>만드는 순서</h2>
  <ol>
     <li>양파와 배추를 썬다</li>
     <li>면을 불린다</li>
      <li>바지락을 손질한다</li>
      <li>세개의 재료를 볶는다</li>

  </ol>
  <p>더 알아보기: <a href="https://ko.wikipedia.org/wiki/스파게티_알레_봉골레">위키백과 스파게티 알레 봉골레</a></p>
      
</body>
</html>
